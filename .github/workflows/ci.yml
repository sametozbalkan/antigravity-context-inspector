name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate JSON manifests
        shell: python
        run: |
          import json, pathlib
          for p in [
              "plugin.json",
              "sidecars/inspector/sidecar.json",
              "sidecars/inspector/package.json",
          ]:
              json.loads(pathlib.Path(p).read_text(encoding="utf-8"))
              print("OK:", p)

      - name: Check Python syntax & run unit tests
        run: |
          python -m py_compile sidecars/inspector/inspector.py sidecars/inspector/lib/protobuf.py sidecars/inspector/lib/accounting.py sidecars/inspector/lib/content.py
          python -m unittest discover -s tests -v

      - name: Check Node.js & frontend JS syntax
        run: |
          node --check sidecars/inspector/main.mjs
          node --check sidecars/inspector/public/app.js
