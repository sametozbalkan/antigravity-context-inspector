name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Validate JSON manifests & version sync
        shell: bash
        run: |
          node -e '
            const fs = require("node:fs");
            const files = [
              "plugin.json",
              "sidecars/inspector/sidecar.json",
              "sidecars/inspector/package.json",
            ];
            const manifests = {};
            for (const p of files) {
              manifests[p] = JSON.parse(fs.readFileSync(p, "utf8"));
              console.log("OK:", p);
            }
            const vPlugin = manifests["plugin.json"].version;
            const vPkg = manifests["sidecars/inspector/package.json"].version;
            if (!vPlugin || vPlugin !== vPkg) {
              throw new Error(`Version mismatch: plugin.json=${JSON.stringify(vPlugin)} vs package.json=${JSON.stringify(vPkg)}`);
            }
            console.log("Version sync OK:", vPlugin);
          '

      - name: Check Node.js & frontend JS syntax
        shell: bash
        run: |
          node --check sidecars/inspector/main.mjs
          node --check sidecars/inspector/inspector.mjs
          node --check sidecars/inspector/lib/protobuf.mjs
          node --check sidecars/inspector/lib/accounting.mjs
          node --check sidecars/inspector/lib/subagents.mjs
          node --check sidecars/inspector/lib/content.mjs
          node --check sidecars/inspector/lib/snapshot.mjs
          node --check sidecars/inspector/public/app.js
          node --check sidecars/inspector/public/js/utils.js
          node --check sidecars/inspector/public/js/sparkline.js
          node --check sidecars/inspector/public/js/views.js
          for f in tests/*.mjs; do node --check "$f"; done

      - name: Run unit tests
        shell: bash
        run: node --test tests/*.test.mjs

      - name: Check bash installer syntax
        shell: bash
        run: bash -n scripts/install.sh

      - name: Check PowerShell installer syntax
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'scripts/install.ps1').Path,
            [ref]$null,
            [ref]$errors
          )
          if ($errors -and $errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.ToString() }
            exit 1
          }
          Write-Host 'PowerShell syntax OK: scripts/install.ps1'
